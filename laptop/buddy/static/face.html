<!doctype html>
<!-- The buddy's face, for a phone placed in the toy. Open
     http://<laptop IP>:8765/face on the phone (same Wi-Fi as the laptop). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: draw under the notch and rounded corners too. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <!-- "Add to Home Screen" on iPhone opens it full screen, without Safari's bars. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#d97757">
  <title>Buddy face</title>
  <style>
    /* Orange everywhere, no scrolling, no text selection or tap highlight. */
    html, body {
      margin: 0;
      height: 100%;
      background: #d97757;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="face"></canvas>
  <script src="/static/face.js"></script>
</body>
</html>
