<!doctype html>
<!--
  The buddy's eyes, shown on a phone mounted in the figurine.
  Open http://<laptop address>:8765/face on the phone (the server prints the
  address when it starts). The page asks the laptop for the mood 3 times a
  second (GET /face/state) and draws the matching eyes.

  The drawing is the same as the old TFT firmware (face.c): an imaginary
  320 x 240 screen, scaled up to fill the phone. Moods:
    IDLE, WORKING      -> normal eyes (blinks, glances left/right)
    DONE               -> happy ^ ^ (bounces)
    NEEDS_YOU          -> sad, with slanted brows
    ANNOYED, YELLING   -> ouch > < (shakes)
  A slap or the undo button also shows > < for 1.5 s (reaction_id changes).

  The phone is also the buddy's speaker. Phones only allow sound after a tap,
  so the page says "Tap for sound" until the screen is tapped once. After
  that, each new sound_id in /face/state plays /face/sounds/<sound>.mp3.
  Until then the laptop plays the voice itself.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Fit the phone screen, no zooming by double tap. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- Full screen when added to the iPhone home screen. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#FF3C00">
  <title>Buddy Face</title>
  <style>
    /* The whole page is orange, no scrollbars, no margins. */
    html, body { margin: 0; height: 100%; background: #FF3C00; overflow: hidden; }
    /* The canvas covers the whole screen. */
    /* cursor: pointer makes iPhone Safari treat the canvas as tappable. */
    canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
    /* Small grey dot in a corner while the laptop can't be reached. */
    #offline {
      position: fixed; right: 12px; bottom: 12px; width: 14px; height: 14px;
      border-radius: 50%; background: #555; display: none;
    }
    /* "Tap for sound" note, shown until the phone allows sound. */
    /* "New chat? Tap = yes (3)" while the buddy waits for a yes-tap. */
    #question {
      position: fixed; left: 0; right: 0; top: 10%; text-align: center;
      font: 800 9vmin -apple-system, sans-serif; color: #000; display: none;
    }
    #soundHint {
      position: fixed; left: 0; right: 0; bottom: 16px; text-align: center;
      font: 600 18px -apple-system, sans-serif; color: #000; opacity: 0.6;
    }
  </style>
</head>
<body>
  <canvas id="face"></canvas>
  <div id="offline" title="Can't reach the laptop"></div>
  <div id="soundHint">Tap for sound</div>
  <div id="question"></div>
  <script>
    // ---- Look (same numbers as the firmware's face.c) ----
    const VIRTUAL_W = 320;          // the imaginary screen we draw on
    const VIRTUAL_H = 240;
    const BG = "#FF3C00";           // bright orange background
    const EYE = "#000000";          // black eyes
    const EYE_W = 28;               // normal eye width
    const EYE_H = 64;               // normal eye height
    const SAD_EYE_H = 40;           // smaller eyes when sad
    const STROKE = 10;              // line thickness for ^ ^, > < and brows
    const BOX_W = 96;               // each eye sits in a 96 px wide box at a screen edge
    const CY = VIRTUAL_H / 2;                   // both eyes are vertically centred
    // Move the eyes this much closer together than "at the screen edges".
    // Each eye moves in by half of it. Change and reload the page to adjust.
    const EYES_CLOSER_CM = 5;
    // Recent iPhones show about 60 CSS pixels per real centimetre
    // (around 153 per inch). Approximate, but close for all current iPhones.
    const CSS_PX_PER_CM = 60;

    // ---- Timing ----
    const POLL_MS = 300;            // ask the laptop for the mood this often
    const HAPPY_BOUNCE_MS = 1200;   // how long ^ ^ bounces after becoming happy
    const OUCH_SHAKE_MS = 900;      // how long > < shakes
    const REACT_MS = 1500;          // how long a slap / button press shows > <

    // Which face each buddy state shows.
    const FACE_FOR_STATE = {
      IDLE: "normal", WORKING: "normal", DONE: "happy",
      NEEDS_YOU: "sad", ANNOYED: "ouch", YELLING: "ouch",
    };

    const canvas = document.getElementById("face");
    const ctx = canvas.getContext("2d");
    const offlineDot = document.getElementById("offline");
    const soundHint = document.getElementById("soundHint");
    const questionBox = document.getElementById("question");

    // ---- Voice ----
    // Uses the Web Audio system. iPhones only let a page make sound after one
    // tap; Web Audio then stays allowed, so every later clip plays by itself
    // when the laptop orders it (no more taps).
    let audioCtx = null;            // the Web Audio "sound card", made on the first tap
    const clipBuffers = {};         // clip name -> promise of its decoded sound
    let currentSource = null;       // the clip playing now, to cut it off
    let playToken = 0;              // goes up per play/stop, so a slow download can't play late
    let lastSoundId = null;         // sound_id from the laptop, to spot new orders

    // ---- Face state ----
    let baseFace = "normal";        // the face for the buddy's current state
    let face = "normal";            // the face on screen (can be a short reaction)
    let faceStart = performance.now();  // when the current face started (for animations)
    let reactUntil = 0;             // end time of a > < reaction, 0 = none
    let lastReactionId = null;      // reaction_id from the laptop, to spot new slaps
    let nextBlink = faceStart + 1000 + Math.random() * 2000;  // when the next blink starts
    let blinkStart = -1;            // when the current blink started, -1 = not blinking
    let lookX = 0;                  // current sideways glance offset
    let lookTarget = 0;             // where the glance is moving to
    let nextGlance = faceStart + 1500;  // when to pick a new glance direction

    function setFace(newFace, now) {
      // Switch to a new face and restart its animation.
      face = newFace;
      faceStart = now;
      blinkStart = -1;
      nextBlink = now + 1000 + Math.random() * 2000;
      lookTarget = 0;
      nextGlance = now + 1500;
    }

    // ---- Talking to the laptop ----
    async function poll() {
      try {
        // cache: "no-store" makes sure the phone never shows an old answer.
        // audio=1 tells the laptop "send the voice here" (only once sound works).
        const url = soundReady() ? "/face/state?audio=1" : "/face/state";
        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) throw new Error("status " + response.status);
        const data = await response.json();
        offlineDot.style.display = "none";          // connected: hide the grey dot
        updateSoundHint();                          // show "Tap for sound" if sound got switched off
        const now = performance.now();

        // A new slap or button press: show > < for a moment.
        if (lastReactionId !== null && data.reaction_id !== lastReactionId) {
          reactUntil = now + REACT_MS;
          setFace("ouch", now);
        }
        lastReactionId = data.reaction_id;

        // The buddy is asking something ("New chat?"): show it with the
        // seconds left. A tap on the TOY (not the phone) answers yes.
        if (data.question) {
          questionBox.textContent = data.question + " Tap me = yes (" + data.question_left + ")";
          questionBox.style.display = "block";
        } else {
          questionBox.style.display = "none";
        }

        // A new sound order: stop the clip playing, then play the new one
        // (sound is null for "stop talking"). On the first answer only
        // remember the number, so reloading the page doesn't replay a clip.
        if (lastSoundId !== null && data.sound_id !== lastSoundId) {
          playClip(data.sound);
        }
        lastSoundId = data.sound_id;

        // The buddy's state changed: switch faces (unless a reaction is playing).
        const wanted = FACE_FOR_STATE[data.state] || "normal";
        if (wanted !== baseFace) {
          baseFace = wanted;
          if (!reactUntil) setFace(wanted, now);
        }
      } catch (error) {
        offlineDot.style.display = "block";         // laptop unreachable: show the grey dot
      }
      setTimeout(poll, POLL_MS);                    // ask again in a moment
    }

    // ---- Drawing ----
    function resize() {
      // Make the canvas sharp on high-resolution phone screens.
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.round(window.innerWidth * ratio);
      canvas.height = Math.round(window.innerHeight * ratio);
    }

    function line(x0, y0, x1, y1) {
      // Thick line with square ends, like the firmware's chunky pixel lines.
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.stroke();
    }

    function drawEye(cx, side, pose) {
      // side: 0 = left eye, 1 = right eye. m flips shapes for the right eye.
      const m = side ? -1 : 1;
      const x = cx + pose.dx;
      const y = CY + pose.dy;
      if (pose.shape === "rect") {                       // normal: tall rectangle
        ctx.fillRect(x - EYE_W / 2, y - pose.h / 2, EYE_W, pose.h);
      } else if (pose.shape === "happy") {               // ^
        line(x - 22, y + 10, x, y - 14);
        line(x, y - 14, x + 22, y + 10);
      } else if (pose.shape === "ouch") {                // > on the left, < on the right
        line(x - 14 * m, y - 24, x + 14 * m, y);
        line(x + 14 * m, y, x - 14 * m, y + 24);
      } else if (pose.shape === "sad") {                 // smaller, lower eye with a slanted brow
        const eyeY = y + 14;
        ctx.fillRect(x - EYE_W / 2, eyeY - pose.h / 2, EYE_W, pose.h);
        line(x - 20 * m, y - 26, x + 18 * m, y - 42);   // low outside, raised inside
      }
    }

    function blinkHeight(now, fullH) {
      // Returns the eye height: full most of the time, squashed during a blink.
      if (blinkStart < 0 && now >= nextBlink) {
        blinkStart = now;                                // start a blink
        nextBlink = now + 2000 + Math.random() * 3500;   // next one in 2 to 5.5 s
      }
      if (blinkStart < 0) return fullH;
      const t = now - blinkStart;
      if (t < 40) return fullH / 2;                      // closing
      if (t < 100) return 8;                             // closed
      if (t < 140) return fullH / 2;                     // opening
      blinkStart = -1;                                   // blink finished
      return fullH;
    }

    function poseFor(now) {
      // Works out the shape and offsets of the eyes for this frame.
      const t = now - faceStart;
      if (face === "happy") {
        // Bounce up and down every 150 ms for the first 1.2 s.
        const up = t < HAPPY_BOUNCE_MS && Math.floor(t / 150) % 2 === 1;
        return { shape: "happy", dx: 0, dy: up ? -6 : 0, h: 0 };
      }
      if (face === "sad") {
        // Droop down slowly over 0.4 s, and still blink.
        return { shape: "sad", dx: 0, dy: Math.min(t / 100, 4), h: blinkHeight(now, SAD_EYE_H) };
      }
      if (face === "ouch") {
        // Shake left and right every 50 ms for the first 0.9 s.
        const shake = t < OUCH_SHAKE_MS ? (Math.floor(t / 50) % 2 ? 4 : -4) : 0;
        return { shape: "ouch", dx: shake, dy: 0, h: 0 };
      }
      // Normal: now and then glance left or right, and blink.
      if (now >= nextGlance) {
        const targets = [0, 0, 0, -10, 10];              // mostly look straight ahead
        lookTarget = targets[Math.floor(Math.random() * targets.length)];
        nextGlance = now + 1500 + Math.random() * 3500;
      }
      if (lookX < lookTarget) lookX = Math.min(lookX + 2, lookTarget);
      else if (lookX > lookTarget) lookX = Math.max(lookX - 2, lookTarget);
      return { shape: "rect", dx: lookX, dy: 0, h: blinkHeight(now, EYE_H) };
    }

    function frame(now) {
      // End a finished > < reaction and go back to the state's face.
      if (reactUntil && now >= reactUntil) {
        reactUntil = 0;
        setFace(baseFace, now);
      }

      // Scale the 320 x 240 drawing as large as fits (keeps the eye shapes),
      // centred up and down.
      const scale = Math.min(canvas.width / VIRTUAL_W, canvas.height / VIRTUAL_H);
      const offsetX = 0;
      const offsetY = (canvas.height - VIRTUAL_H * scale) / 2;
      // How wide the phone screen is in drawing units. A wide phone is wider
      // than 320, so the eyes go to the real edges, like on the old display.
      const screenW = canvas.width / scale;
      // Turn EYES_CLOSER_CM into drawing units: cm -> CSS pixels -> device
      // pixels (x devicePixelRatio) -> drawing units (/ scale).
      const ratio = window.devicePixelRatio || 1;
      const insetPerEye = (EYES_CLOSER_CM / 2) * CSS_PX_PER_CM * ratio / scale;
      // Never let the eyes get closer than one eye box apart (small screens).
      const maxInset = Math.max(0, (screenW - 2 * BOX_W) / 2);
      const inset = Math.min(insetPerEye, maxInset);
      const leftCx = BOX_W / 2 + inset;              // left eye centre
      const rightCx = screenW - BOX_W / 2 - inset;   // right eye centre

      ctx.setTransform(1, 0, 0, 1, 0, 0);               // reset scaling
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, canvas.width, canvas.height);  // orange background
      ctx.setTransform(scale, 0, 0, scale, offsetX, offsetY);
      ctx.fillStyle = EYE;
      ctx.strokeStyle = EYE;
      ctx.lineWidth = STROKE;
      ctx.lineCap = "square";                           // chunky square ends

      const pose = poseFor(now);
      drawEye(leftCx, 0, pose);
      drawEye(rightCx, 1, pose);
      requestAnimationFrame(frame);                     // draw again next screen refresh
    }

    // ---- Voice ----
    function soundReady() {
      // True if the phone will really play sound right now. The laptop only
      // sends the voice here while this is true (the ?audio=1 in poll()).
      return audioCtx !== null && audioCtx.state === "running";
    }

    function updateSoundHint() {
      // "Tap for sound" stays visible until sound really works. It comes back
      // if the phone switched sound off (for example after the screen locked).
      soundHint.style.display = soundReady() ? "none" : "block";
    }

    function unlockSound() {
      // Must run inside a tap: that is the only moment iPhones allow it.
      // Safe to call several times (one tap can send both touchend and click).
      if (audioCtx === null) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        try {
          // iOS 17+: play even when the ring/silent switch is on silent.
          if (navigator.audioSession) navigator.audioSession.type = "playback";
        } catch (error) {
          // Older iOS: turn the silent switch off instead.
        }
      }
      // Play one silent sample right now, still inside the tap. This is what
      // makes the phone allow sound from this page from now on.
      const silence = audioCtx.createBuffer(1, 1, 22050);
      const source = audioCtx.createBufferSource();
      source.buffer = silence;
      source.connect(audioCtx.destination);
      source.start(0);
      audioCtx.resume().then(() => {
        updateSoundHint();
        preloadClips();                             // download every clip now
      }).catch(() => {
        updateSoundHint();                          // still off: the hint stays
      });
    }

    function loadClip(name) {
      // Downloads and decodes /face/sounds/<name>.mp3 once; later calls reuse it.
      if (!clipBuffers[name]) {
        clipBuffers[name] = fetch("/face/sounds/" + name + ".mp3")
          .then((response) => {
            if (!response.ok) throw new Error("status " + response.status);
            return response.arrayBuffer();
          })
          .then((bytes) => audioCtx.decodeAudioData(bytes))
          .catch((error) => {
            delete clipBuffers[name];               // try the download again next time
            throw error;
          });
      }
      return clipBuffers[name];
    }

    function stopClip() {
      // Cut off the clip playing now, if any.
      playToken += 1;                               // a clip still downloading won't start
      if (currentSource !== null) {
        try { currentSource.stop(); } catch (error) { /* already finished */ }
        currentSource = null;
      }
    }

    function playClip(name) {
      // name is the clip to play, or null for "stop talking".
      stopClip();
      if (!name || !soundReady()) return;
      const myToken = playToken;
      loadClip(name).then((buffer) => {
        if (myToken !== playToken) return;          // another order came in meanwhile
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);
        source.start(0);
        currentSource = source;
      }).catch(() => {
        // Download failed: nothing to play. The next order tries again.
      });
    }

    async function preloadClips() {
      // Download and decode every clip once so later plays start instantly.
      try {
        const response = await fetch("/face/sounds");
        const data = await response.json();
        for (const name of data.clips) {
          loadClip(name).catch(() => {});
        }
      } catch (error) {
        // Not important: clips then download when first played.
      }
    }

    // ---- Keep the phone screen on (only works on some phones over http) ----
    async function keepAwake() {
      try {
        if ("wakeLock" in navigator) await navigator.wakeLock.request("screen");
      } catch (error) {
        // Not allowed here: set the phone's auto-lock to "Never" instead.
      }
    }
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        keepAwake();                                // ask again after unlocking
        // The phone pauses sound when the screen locks; try to restart it.
        // If the phone refuses, "Tap for sound" shows again.
        if (audioCtx !== null) audioCtx.resume().catch(() => {});
      }
    });

    // Tapping the screen turns sound on, and asks for full screen (works on
    // Android; on iPhone use "Add to Home Screen" instead).
    function onTap() {
      unlockSound();
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
      keepAwake();
    }
    // iPhone Safari often doesn't pass taps on a plain canvas up to the page,
    // so the canvas and the hint listen themselves, for both touch (phones)
    // and click (computers). A tap that sends both just unlocks twice, harmless.
    canvas.addEventListener("touchend", onTap);
    canvas.addEventListener("click", onTap);
    soundHint.addEventListener("touchend", onTap);
    soundHint.addEventListener("click", onTap);

    window.addEventListener("resize", resize);  // phone rotated
    resize();
    keepAwake();
    poll();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
